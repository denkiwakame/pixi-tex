[workspace]
authors = ["denkiwakame <denkivvakame@gmail.com>"]
channels = ["conda-forge"]
name = "draftpilot"
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]
version = "0.1.0"

[activation.env]
TECTONIC_CACHE_DIR = ".tectonic-cache" # use $HOME/.cache by default

[tasks]
setup-jmlr = """
wget -q https://github.com/JmlrOrg/jmlr-style-file/archive/master.tar.gz && \
tar xzf master.tar.gz --strip-components=1 && \
rm master.tar.gz
"""
setup-eccv = """
wget -q https://github.com/paolo-favaro/paper-template/archive/refs/heads/main.tar.gz -O paper-template.tar.gz && \
tar xzf paper-template.tar.gz --strip-components=1 && \
rm paper-template.tar.gz
"""

[tasks.link]
cmd = "ln -sfn .claude .cursor"
description = "Create .cursor -> .claude symlink for Cursor compatibility"

[tasks.build]
cmd = "tectonic --outdir build --keep-logs --keep-intermediates {{ tex }}"
args = [{ arg = "tex", default = "draft.tex" }]

[dependencies]
tectonic = ">=0.15.0,<0.16"

[feature.lint.dependencies]
prek = ">=0.2.21,<0.3"
typos = ">=1.40.0,<2"
tex-fmt = ">=0.5.6,<0.6"

[feature.lint.tasks]
prek-install = "prek install"
prek-uninstall = "prek uninstall"
lint = "prek run --all-files"

[environments]
lint = { features = ["lint"] }
